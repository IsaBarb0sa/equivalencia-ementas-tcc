[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "equivalencia-ementas"
version = "0.1.0"
description = "Sistema para análise automatizada de equivalência entre ementas acadêmicas"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Banco de dados
    "SQLAlchemy>=2.0,<3.0",
    "pyodbc>=5.0,<6.0",

    # Configurações
    "pydantic-settings>=2.0,<3.0",

    # Leitura e processamento de PDFs
    "pdfplumber>=0.11,<1.0",
    "pypdf>=5,<7",
    "pytesseract>=0.3.13,<0.4",
    "pypdfium2>=4,<6",
    "opencv-python-headless>=4.10,<5",
    "reportlab>=4,<5",

    # API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.20,<1.0",

    # Inteligência artificial
    "google-genai>=1.0,<2.0",
    "openai>=2.0,<3.0",

    # Segurança e comunicação
    "argon2-cffi>=23.1,<26.0",
    "httpx>=0.27,<1.0",

    "sentence-transformers>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.12,<1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
