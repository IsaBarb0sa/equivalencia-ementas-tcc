[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "equivalencia-ementas"
version = "0.1.0"
description = "Sistema para análise automatizada de equivalência entre ementas acadêmicas"
requires-python = ">=3.11,<3.14"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "pyodbc>=5.0,<6.0",
    "pydantic-settings>=2.0,<3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.12,<1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"